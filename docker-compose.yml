version: '3.8'

services:
  # Node.js Express Web & API Server
  web:
    build: .
    command: node server.js
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    volumes:
      - ./data_store:/app/data_store

  # FastAPI Persistent AI Microservice
  ai-engine:
    build: .
    command: uvicorn fastapi_app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
