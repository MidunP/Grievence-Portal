# ============================================================
# render.yaml — Render.com Infrastructure-as-Code Blueprint
# Deploys a single Docker Web Service with:
#   - Express API (port 3000, public HTTPS)
#   - FastAPI AI Engine (port 8000, internal)
# ============================================================

services:
  - type: web
    name: grievance-portal-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3000

      - key: AI_SERVICE_HOST
        value: 127.0.0.1

      - key: AI_SERVICE_PORT
        value: 8000

      # ──────────────────────────────────────────────────────
      # Set CORS_ORIGIN to your frontend URL(s) or '*' for open access
      # Example: https://grievance-portal.vercel.app
      # ──────────────────────────────────────────────────────
      - key: CORS_ORIGIN
        value: "*"

    # ──────────────────────────────────────────────────────
    # Note: Render persistent disks require Starter ($7/mo) or higher.
    # On the Free plan, ephemeral container storage at /app/data_store
    # is used automatically and initialized on boot.
    # To enable a persistent disk on a paid plan, uncomment below:
    # ──────────────────────────────────────────────────────
    # disk:
    #   name: grievance-data-store
    #   mountPath: /app/data_store
    #   sizeGB: 1
