# ============================================================
# render.yaml — Render.com Infrastructure-as-Code
# Deploys a single Docker Web Service with:
#   - Express API (port 3000, public)
#   - FastAPI AI Engine (port 8000, internal)
#   - Persistent disk at /app/data_store (tickets survive deploys)
# ============================================================

services:
  - type: web
    name: grievance-portal-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3000

      - key: AI_SERVICE_HOST
        value: 127.0.0.1

      - key: AI_SERVICE_PORT
        value: 8000

      # ──────────────────────────────────────────────────────
      # IMPORTANT: After deploying, set CORS_ORIGIN below to
      # your actual Vercel frontend URL, e.g.:
      #   https://grievance-portal.vercel.app
      # You can set this in the Render dashboard under
      # Environment Variables.
      # ──────────────────────────────────────────────────────
      - key: CORS_ORIGIN
        value: https://your-app.vercel.app  # ← REPLACE THIS

    disk:
      name: grievance-data-store
      mountPath: /app/data_store
      sizeGB: 1
